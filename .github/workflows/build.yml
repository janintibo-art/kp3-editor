name: Compiler APK
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk moktek-kaoss-studio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: moktek-kaoss-studio
          path: moktek-kaoss-studio.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v12.0-${{ github.run_number }}
          name: mokteK Kaoss Studio V12 (Program Memory)
          files: moktek-kaoss-studio.apk
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  site:
    needs: apk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
